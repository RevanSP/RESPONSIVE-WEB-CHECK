<!DOCTYPE html>
<html lang="en" data-theme="lofi">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RESPONSIVE WEB CHECK</title>
    <link rel="icon" type="image/webp" href="public/favicon.webp" />
    <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.14/dist/full.min.css" rel="stylesheet" type="text/css" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="public/style.css" />
</head>

<body class="bg-fuchsia-100 h-screen flex justify-center items-center">
    <dialog id="mobileView" class="modal">
        <div
            class="modal-box flex bg-fuchsia-100 items-center justify-center p-4 shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] border-2 border-black rounded-none">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <div class="flex justify-center">
                <div class="mockup-phone mt-8">
                    <div class="camera"></div>
                    <div class="display flex justify-center items-center">
                        <div class="artboard artboard-demo phone-1 mt-12">
                            <iframe id="iframeMobile" class="w-full h-full" frameborder="0"></iframe>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </dialog>

    <dialog id="desktopView" class="modal">
        <div
            class="modal-box w-11/12 bg-fuchsia-100 max-w-full h-96 lg:h-full shadow-[6px_6px_0px_0px_rgba(0,0,0,1)] border-2 border-black rounded-none">
            <form method="dialog">
                <button class="btn btn-sm btn-circle btn-ghost absolute right-2 top-2">✕</button>
            </form>
            <div class="mockup-window bg-fuchsia-500 !border-2 border-black mt-6 h-full">
                <iframe id="iframeDesktop" class="w-full h-full" frameborder="0"></iframe>
            </div>
        </div>
    </dialog>

    <div class="card bg-fuchsia-500 border-2 border-black shadow-[6px_6px_0px_0px_rgba(0,0,0,1)]">
        <div class="card-body">
            <h2 class="card-title flex justify-center items-center font-bold">
                RESPONSIVE WEB CHECK
            </h2>
            <div class="join mt-2">
                <input type="text" id="urlInput" class="text-xs bg-fuchsia-300 input input input-sm text-xs bordered join-item w-full flex items-center gap-2 rounded-none shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px] border-2 border-black"
                    placeholder="URL ... (some websites can be fetched)" />
                <button class="font-bold btn bg-fuchsia-300 btn-sm text-xs btn-square border-2 rounded-none border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px] join-item" onclick="fetchURL()">
                    <i data-lucide='check-circle' class="w-4"></i>
                </button>
            </div>
            <div class="w-full flex join mt-3">
                <button id="mobileViewBtn" class="btn bg-fuchsia-300 border-2 btn-sm text-xs rounded-none border-black  shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px] btn-disabled join-item"
                    onclick="showMobileView()">
                    <i data-lucide='smartphone' class="w-4"></i>&nbsp;MOBILE VIEW
                </button>
                <button id="desktopViewBtn" class="btn bg-fuchsia-300 border-2 rounded-none btn-sm text-xs border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px] btn-disabled join-item"
                    onclick="showDesktopView()">
                    <i data-lucide='monitor' class="w-4"></i>&nbsp;DESKTOP VIEW
                </button>
            </div>
            <div class="flex justify-center space-x-4 mt-5">
                <a href="https://www.instagram.com/m9nokuro" class="btn text-fuchsia-700 bg-fuchsia-400 btn-square btn-sm text-xs border-2 rounded border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px]"><i data-lucide="instagram"
                        class="w-5 h-5"></i>
                </a>
                <a href="https://github.com/RevanSP" class="btn btn-square text-fuchsia-700 bg-fuchsia-400 btn-sm text-xs border-2 rounded border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px]"><i data-lucide="github"
                        class="w-5 h-5"></i>
                </a>
                <a href="https://web.facebook.com/profile.php?id=100082958149027&_rdc=1&_rdr" class="btn text-fuchsia-700 bg-fuchsia-400 btn-square btn-sm text-xs border-2 rounded border-black shadow-[3px_3px_0px_0px_rgba(0,0,0,1)] 
        transition-all duration-200 ease-in-out
        hover:shadow-[1px_1px_0px_0px_rgba(0,0,0,1)] 
        hover:translate-x-[2px] hover:translate-y-[2px]
        active:shadow-none active:translate-x-[3px] active:translate-y-[3px]"><i data-lucide="facebook"
                        class="w-5 h-5"></i>
                </a>
            </div>
            <h3 class="text-center mt-2 font-bold">
                ReiivanTheOnlyOne .
            </h3>
        </div>
    </div>

    </div>

    <script src="public/responsive.js"></script>
    <script>
        lucide.createIcons();
    </script>
</body>

</html>
